<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 15px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f1923; color: white; }
    h3 { margin-top: 0; color: #ff4655; letter-spacing: 1px; }
    
    button { 
      width: 100%; padding: 12px; 
      background: #ff4655; color: white; 
      border: none; cursor: pointer; 
      font-weight: bold; text-transform: uppercase;
      transition: background 0.2s;
    }
    button:hover { background: #ff5864; }
    button:disabled { background: #333; cursor: not-allowed; }

    textarea { 
      width: 100%; height: 100px; 
      margin-top: 15px; padding: 8px;
      font-size: 11px; font-family: monospace;
      background: #1f2326; color: #00ff00; 
      border: 1px solid #444; box-sizing: border-box;
      resize: none;
    }
    .status { font-size: 10px; color: #888; margin-top: 5px; text-align: right; }
  </style>
</head>
<body>
  <h3>Riot Cookie Grabber</h3>
  
  <button id="action-btn">Get Cookie String</button>
  
  <textarea id="output" readonly placeholder="Cookie data will appear here after clicking Get..."></textarea>
  <div id="status-msg" class="status">Status: Ready</div>

  <script src="popup.js"></script>
</body>
</html>
