name: Build and Release Executable

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Executable
        run: npx pkg . --targets node18-win-x64 --output valorant-store-lite.exe

      - name: Zip Extension Folder
        run: zip -r riot-cookie-grabber.zip riot-cookie-grabber/

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Valorant-Store-Lite-Windows
          path: |
            valorant-store-lite.exe
            riot-cookie-grabber.zip
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            valorant-store-lite.exe
            riot-cookie-grabber.zip
          name: Release ${{ github.ref_name }}
          body: "Latest release of Valorant Store Lite.\n\n**Instructions:**\n1. Download the `.exe` file to run the application.\n2. Download `riot-cookie-grabber.zip`, extract it, and load it into Chrome (via Developer Mode) to grab your Riot Cookie."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}